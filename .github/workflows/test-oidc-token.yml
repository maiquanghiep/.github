# .github/workflows/test-oidc-token.yml
name: Test OIDC Token

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  print-oidc-token:
    name: Print OIDC Token Claims
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Request and decode OIDC token
        run: |
          echo "Requesting OIDC token..."

          TOKEN_RESPONSE=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          echo "----- FULL CLAIMS -----"
          echo "$TOKEN" | awk -F '.' '{print $2}' | base64 -d | jq

      - name: Print important fields
        run: |
          TOKEN_RESPONSE=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          CLAIMS=$(echo "$TOKEN" | awk -F '.' '{print $2}' | base64 -d)

          echo "sub:"
          echo "$CLAIMS" | jq -r '.sub'

          echo "workflow_ref:"
          echo "$CLAIMS" | jq -r '.workflow_ref'

          echo "job_workflow_ref:"
          echo "$CLAIMS" | jq -r '.job_workflow_ref'

          echo "repository:"
          echo "$CLAIMS" | jq -r '.repository'

          echo "ref:"
          echo "$CLAIMS" | jq -r '.ref'
