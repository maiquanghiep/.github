name: Call Reusable Release Workflow

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
      description:
        description: 'Release description'
        required: true
        type: string
      babylon_version:
        description: 'Compatible Babylon version tag'
        required: true
        type: string
      prerelease:
        description: 'Whether prerelease is enabled'
        required: true
        type: boolean
        default: true

jobs:
  call-reusable-release:
    uses: babylonlabs-io/.github/.github/workflows/reusable_github_release.yml@hiep/add-release-workflow
    with:
      tag: ${{ inputs.tag }}
      description: ${{ inputs.description }}
      prerelease: ${{ inputs.prerelease }}
      changelog_path: "https://github.com/maiquanghiep/.github/blob/hiep/test-release-note/CHANGELOG.md"
      build_command: |
        # Only use the below command for mainnet
        make build
        # Only use the below command for testnet
        BABYLON_BUILD_OPTIONS="testnet" make build
      docker_image_table_template: |
        | Image | Description |
        |-----------------|----------------|
        | babylonlabs/babylond:${{ inputs.tag }} | Mainnet image |
        | babylonlabs/babylond:${{ inputs.tag }}-testnet | Testnet image |
      dependencies_template: |
        - This release is compatible with [Babylon ${{ inputs.babylon_version }}](https://github.com/babylonlabs-io/babylon/releases/tag/${{ inputs.babylon_version }})
        - This release is compatible with [Vigilante ${{ inputs.babylon_version }}](https://github.com/babylonlabs-io/babylon/releases/tag/${{ inputs.babylon_version }})
    secrets: inherit
